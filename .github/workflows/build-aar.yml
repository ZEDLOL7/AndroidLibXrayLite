name: Build libv2ray AAR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # позволяет запускать вручную из Actions UI

permissions:
  contents: write   # для upload to releases
  packages: write   # для publish в GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install gomobile + gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Build libv2ray.aar
        run: |
          gomobile bind -v -androidapi 21 -ldflags="-s -w" \
            -target=android -o libv2ray.aar .

      - name: Compute SHA256
        run: sha256sum libv2ray.aar > libv2ray.aar.sha256

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libv2ray.aar
            libv2ray.aar.sha256

      - name: Publish to GitHub Packages (Maven)
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          POM=$(mktemp)
          cat > "$POM" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>app.chromavpn</groupId>
            <artifactId>libv2ray</artifactId>
            <version>${VERSION}</version>
            <packaging>aar</packaging>
          </project>
          EOF

          REPO_URL="https://maven.pkg.github.com/${GH_USER}/AndroidLibXrayLite"

          curl -fsSL -X PUT -u "${GH_USER}:${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @libv2ray.aar \
            "${REPO_URL}/app/chromavpn/libv2ray/${VERSION}/libv2ray-${VERSION}.aar"

          curl -fsSL -X PUT -u "${GH_USER}:${GH_TOKEN}" \
            -H "Content-Type: application/xml" \
            --data-binary @"$POM" \
            "${REPO_URL}/app/chromavpn/libv2ray/${VERSION}/libv2ray-${VERSION}.pom"

          echo "Published app.chromavpn:libv2ray:${VERSION} to GitHub Packages."
